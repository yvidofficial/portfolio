<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divy Garg — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base Styles - Dark Cinematic Mode */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navbar */
        .site-header {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            background: #121212;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-link {
            text-decoration: none;
            color: #888888;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #FFFFFF;
        }

        /* Centered Logo Avatar */
        .centered-logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-logo-center {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            filter: drop-shadow(0 4px 20px rgba(78, 6, 124, 0.35));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .profile-logo-center:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 6px 30px rgba(78, 6, 124, 0.55));
        }

        /* Pages Control */
        .page {
            display: none;
            min-height: calc(100vh - 140px);
            padding: 30px 20px 50px 20px;
        }

        .page.active-page {
            display: block;
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero-section h1 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        .scroll-hint {
            color: #777777;
            font-size: 15px;
            font-weight: 400;
        }

        /* Selected Works Header Pill */
        .selected-works-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .selected-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* 3D Carousel Stage */
        .carousel-stage-wrapper {
            position: relative;
            max-width: 1100px;
            width: 100%;
            height: 520px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        .carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-card {
            position: absolute;
            width: 310px;
            height: 490px;
            border-radius: 18px;
            background: #000000;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            backface-visibility: hidden;
        }

        /* 3D Positioning States */
        .carousel-card.card-center {
            transform: translateX(0) scale(1) rotateY(0deg);
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        .carousel-card.card-left {
            transform: translateX(-260px) scale(0.82) rotateY(20deg);
            opacity: 0.4;
            z-index: 2;
            cursor: pointer;
        }

        .carousel-card.card-right {
            transform: translateX(260px) scale(0.82) rotateY(-20deg);
            opacity: 0.4;
            z-index: 2;
            cursor: pointer;
        }

        .carousel-card.hide {
            transform: translateX(0) scale(0.4);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Video Wrapper & Overlay */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
            background: #000;
        }

        .rotatable-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            display: block;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Permanent Top Action Buttons */
        .expand-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
            z-index: 25;
        }

        .expand-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.08);
        }

        .top-right-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 25;
        }

        .top-action-btn {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        .top-action-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.08);
        }

        /* Liquid Glass Video Controls Overlay */
        .video-controls-overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            display: flex;
            flex-direction: column; /* Changed to column for stacking */
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
